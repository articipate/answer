name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14, macos-15-intel]
        python-version: ['3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --extra dev
    
    - name: Run linter
      run: uv run ruff check src tests || true
    
    - name: Run tests
      run: uv run pytest -v || true
    
    - name: Test self-test
      run: uv run python -m answer_dataset.app --self-test
    
    - name: Install build dependencies
      run: uv sync --extra build
    
    - name: Build with cx_Freeze
      run: |
        cd packaging/cxfreeze
        uv run python setup.py build_exe
      shell: bash
    
    - name: Test built executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $exe = Get-ChildItem -Path packaging/cxfreeze/build -Recurse -Filter "Answer.exe" | Select-Object -First 1
        if ($exe) { & $exe.FullName --self-test }
      shell: pwsh
    
    - name: Test built executable (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        exe=$(find packaging/cxfreeze/build -name "Answer" -type f | head -1)
        if [ -n "$exe" ]; then chmod +x "$exe" && "$exe" --self-test; fi
      shell: bash
