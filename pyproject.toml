[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "answer-dataset"
version = "0.1.0"
description = "Open-source desktop app to generate datasets from documents using AI APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Articipate" },
]
keywords = ["dataset", "llm", "ai", "documents", "qa", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
]

dependencies = [
    "PySide6>=6.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "tiktoken>=0.8.0",
    "jsonschema>=4.23.0",
    "json-repair>=0.30.0",
    "keyring>=25.0.0",
    "platformdirs>=4.2.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
    "python-dateutil>=2.9.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pyinstaller>=6.10.0",  # not used, cx_Freeze is used for release
]
build = [
    "cx-Freeze>=8.0.0",
]
all = [
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",
    "openai>=1.40.0",
]

[project.scripts]
answer = "answer_dataset.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/answer_dataset"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
